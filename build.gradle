plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    enable {
        version = neo_version
        // Binary patches instead of decompiling + recompiling Minecraft: a much lighter setup in the memory-capped
        // build container (tools/gradle-docker.sh). No Minecraft sources in the IDE then; flip it off locally if wanted.
        disableRecompilation = true
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.console.level', 'info'
        }

        server {
            server()
            gameDirectory = project.file('run')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            programArgument '--nogui'
        }

        // Runs every gametest in src/main/java/.../ChainsawGameTests.java, then exits (non-zero if one fails).
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            neo_version: neo_version, neo_version_range: neo_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    from('LICENSE')
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : mod_authors,
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

// Every gametest run starts from a fresh world (item entities left over from the last run would be counted as drops).
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst { delete file('run-gametest/world') }
}
